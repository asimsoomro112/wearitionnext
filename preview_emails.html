<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Previews</title>
    <style>
        body { background: #f0f0f0; padding: 40px; font-family: sans-serif; }
        .container { max-width: 1300px; margin: 0 auto; display: flex; gap: 40px; flex-wrap: wrap; }
        .preview-box { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex: 1; min-width: 600px; }
        h3 { text-align: center; color: #333; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
        iframe { width: 100%; height: 800px; border: none; }
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-bottom: 40px; font-weight: 300; letter-spacing: 4px;">WEARITION EMAIL PREVIEWS</h2>
    <div class="container">
        <div class="preview-box">
            <h3>1. Verification OTP Email</h3>
            <iframe id="otp-frame"></iframe>
        </div>
        <div class="preview-box">
            <h3>2. Order Confirmation</h3>
            <iframe id="order-frame"></iframe>
        </div>
    </div>

    <script>
        // Inline the templates for preview
        const BRAND = {
            name: 'WEARITION',
            tagline: 'Modern Luxury. Timeless Craft.',
            logo: 'https://wearition.store/logo.png', 
            website: 'https://wearition.store',
            colors: { bg: '#ffffff', card: '#ffffff', accent: '#D4AF37', text: '#000000', muted: '#888888', white: '#FFFFFF', border: '#f0f0f0' }
        };

        function emailWrapper(content, preheader = '') {
            return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap');body { margin: 0; padding: 0; background-color: #f8f8f8; font-family: 'Inter', Arial, sans-serif; }.email-container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border: 1px solid #eeeeee; }h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 1px; }.otp-box { background: #000000; color: #D4AF37; font-size: 32px; letter-spacing: 8px; font-weight: bold; padding: 24px; text-align: center; border-radius: 4px; margin: 32px 0; font-family: 'Inter', monospace; }</style></head><body style="margin:0;padding:0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f8f8;padding:20px;"><tr><td align="center"><table class="email-container" role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;"><tr><td style="padding:60px 40px 40px;text-align:center;"><h1 style="color:#000000;font-size:32px;margin:0;letter-spacing:6px;font-weight:300;">${BRAND.name}</h1><p style="color:#D4AF37;font-size:10px;letter-spacing:4px;text-transform:uppercase;margin:8px 0 0;">${BRAND.tagline}</p></td></tr>${content}<tr><td style="padding:60px 40px;background-color:#000000;text-align:center;"><p style="color:#D4AF37;font-size:9px;letter-spacing:4px;text-transform:uppercase;margin:0 0 24px;">Connect with the Maison</p><p style="color:#555555;font-size:10px;">&copy; 2026 ${BRAND.name} LUXURY RETAIL GROUP.</p></td></tr></table></td></tr></table></body></html>`;
        }

        const otpContent = `<tr><td style="padding:40px 60px;"><h2 style="color:#000000;font-size:36px;margin:0 0 24px;text-align:center;">Verify Your Account</h2><p style="color:#555555;font-size:14px;line-height:1.8;text-align:center;margin-bottom:32px;">Welcome to the inner circle of WEARITION. To complete your registration and unlock exclusive access, please use the following verification code:</p><div class="otp-box">774295</div><p style="color:#999999;font-size:11px;text-align:center;margin-top:32px;">This code is valid for 10 minutes.</p></td></tr>`;
        
        const orderContent = `<tr><td style="padding:40px 60px;"><p style="color:#D4AF37;font-size:10px;letter-spacing:4px;text-transform:uppercase;text-align:center;margin-bottom:12px;font-weight:600;">Confirmation</p><h2 style="color:#000000;font-size:36px;margin:0 0 32px;text-align:center;">Your order is being prepared</h2><div style="background:#fcfcfc;padding:24px;border:1px solid #f0f0f0;margin-bottom:40px;text-align:center;"><p style="margin:0 0 4px;font-size:10px;color:#888888;letter-spacing:2px;">ORDER NUMBER</p><p style="margin:0;font-size:24px;font-weight:300;color:#000000;letter-spacing:4px;">WR-99821</p></div><table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:24px 0;border-bottom:1px solid #f5f5f5;"><table width="100%" cellpadding="0" cellspacing="0"><tr><td width="80"><div style="width:80px;height:100px;background:#eee;"></div></td><td style="padding-left:20px;"><p style="margin:0;font-size:13px;font-weight:600;color:#000000;">NOIR VELVET BLAZER</p><p style="margin:6px 0 0;font-size:11px;color:#888888;letter-spacing:1px;">QTY: 1 · SIZE L</p></td><td align="right"><p style="margin:0;font-size:13px;font-weight:600;color:#000000;">Rs. 24,500</p></td></tr></table></td></tr><tr><td colspan="3" style="padding-top:32px;"><table width="100%" cellpadding="0" cellspacing="0"><tr><td style="font-size:12px;color:#888888;padding-bottom:8px;">Subtotal</td><td align="right" style="font-size:12px;color:#000000;padding-bottom:8px;">Rs. 24,500</td></tr><tr><td style="font-size:14px;font-weight:bold;color:#000000;padding-top:16px;">Total</td><td align="right" style="font-size:18px;font-weight:bold;color:#D4AF37;padding-top:16px;">Rs. 24,750</td></tr></table></td></tr></table></td></tr>`;

        document.getElementById('otp-frame').srcdoc = emailWrapper(otpContent);
        document.getElementById('order-frame').srcdoc = emailWrapper(orderContent);
    </script>
</body>
</html>
